name: Build and verify Sheetgeist
on:
  push:
    branches: [main]
    paths: ['vendor/**', 'tests-e2e/**', '**.zip', '.github/workflows/build.yml', 'src/**', 'public/**', 'package*.json', 'vite.config.ts']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Expand approved source update
        shell: bash
        run: |
          for package in *sheetgeist*.zip; do
            [ -f "$package" ] || continue
            unzip -o "$package"
            rm "$package"
          done
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - name: Publish static assets and unpacked source
        shell: bash
        run: |
          rm -rf docs
          cp -r dist docs
          touch docs/.nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .kiro src public vendor tests-e2e README.md LICENSE KIRO_USAGE.md .gitignore package.json package-lock.json tsconfig*.json vite.config.ts vitest.config.ts index.html docs
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified app and source [skip ci]'
            git push
          fi
